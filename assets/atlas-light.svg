<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="ctxfeed 架构：repo files → ShardPlan builder → GLM-5.2 (1M ctx)，cache-key store → MCP server → coding agents">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- ===== static base connectors (底层静线) ===== -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <!-- top row: A→B, B→C -->
    <line x1="172" y1="72" x2="216" y2="72" marker-end="url(#ah-l)"/>
    <line x1="392" y1="72" x2="440" y2="72" marker-end="url(#ah-l)"/>
    <!-- B↓E: ShardPlan writes cache keys (vertical) -->
    <line x1="304" y1="104" x2="304" y2="232" marker-end="url(#ah-l)"/>
    <!-- E→D: cache serves MCP server -->
    <line x1="392" y1="264" x2="440" y2="264" marker-end="url(#ah-l)"/>
    <!-- D→F: server serves coding agents -->
    <line x1="600" y1="264" x2="648" y2="264" marker-end="url(#ah-l)"/>
    <!-- C→E: prefix-cache reuse (dashed diagonal, GLM ↔ cache) -->
    <path d="M 520 104 Q 455 168 392 232" stroke-dasharray="4 6" marker-end="url(#ah-l)"/>
  </g>

  <!-- ===== marching dash data flow (顶层, 数据方向) ===== -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- A→B: repo files into ShardPlan (dasharray 周期=16, from 32→0 = 2 周期, 无缝) -->
    <line x1="172" y1="72" x2="212" y2="72" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <!-- B→C: ShardPlan → GLM-5.2 -->
    <line x1="392" y1="72" x2="436" y2="72" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <!-- B↓E: cache-key write (vertical down) -->
    <line x1="304" y1="104" x2="304" y2="228" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <!-- D→F: MCP server → coding agents -->
    <line x1="600" y1="264" x2="644" y2="264" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== animateMotion packet dots ===== -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M172,72 L212,72" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M392,72 L436,72" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== nodes ===== -->
  <!-- A: Repo files (blue 基建) -->
  <g>
    <rect x="24" y="40" width="148" height="64" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="98" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Repo files</text>
    <text x="98" y="94" text-anchor="middle" font-size="10" fill="#6E6E73">1000+ files</text>
  </g>
  <!-- B: ShardPlan builder (紫 agent/core) — 呼吸 -->
  <g>
    <rect x="216" y="40" width="176" height="64" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="304" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">ctxfeed ingest</text>
    <text x="304" y="90" text-anchor="middle" font-size="11" font-weight="500" fill="#4B3FC4">ShardPlan builder</text>
  </g>
  <!-- C: GLM-5.2 (绿 inference) — 呼吸 -->
  <g>
    <rect x="440" y="40" width="160" height="64" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="520" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">GLM-5.2 API</text>
    <text x="520" y="90" text-anchor="middle" font-size="11" fill="#0B6B53">1M-token window</text>
  </g>
  <!-- E: cache-key store (sqlite) — under B -->
  <g>
    <rect x="216" y="232" width="176" height="64" rx="15" fill="#0071E3" fill-opacity="0.08" stroke="#0071E3" stroke-width="1.5"/>
    <text x="304" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#0A4F9E">cache-key store</text>
    <text x="304" y="282" text-anchor="middle" font-size="10" fill="#6E6E73">sqlite · prefix-cache reuse</text>
  </g>
  <!-- D: MCP server stdio (紫) — 呼吸 -->
  <g>
    <rect x="440" y="232" width="160" height="64" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="520" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#4B3FC4">MCP server</text>
    <text x="520" y="282" text-anchor="middle" font-size="10" fill="#4B3FC4">stdio · one round-trip</text>
  </g>
  <!-- F: coding agents (绿) -->
  <g>
    <rect x="648" y="232" width="200" height="64" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5"/>
    <text x="748" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#0B6B53">Claude Code</text>
    <text x="748" y="282" text-anchor="middle" font-size="10" fill="#0B6B53">Cursor · Codex</text>
  </g>
</svg>
